<svg viewBox="0 0 720 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agent Control Plane system diagram</title>
  <desc id="desc">Agent Control Plane governs Shared Contracts and Schemas, which flow down to Inference Telemetry and Developer Learning. Inference Telemetry feeds back to the Agent Control Plane as an observed signal (solid line); Developer Learning feeds back as reinforced understanding (dotted line).</desc>
  <style>
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  </style>
  <defs>
    <marker id="arrow-flow-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#85a4e8" />
    </marker>
    <marker id="arrow-feedback-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e79654" />
    </marker>
  </defs>

  <!-- Feedback paths -->
  <path fill="none" stroke="#e79654" stroke-width="1.75" marker-end="url(#arrow-feedback-dark)"
        d="M 168,338 C 60,300 60,120 172,66" />
  <text class="mono" x="38" y="205" font-size="11.5" letter-spacing="0.3" fill="#e79654" text-anchor="middle" transform="rotate(-90 38 205)">observed signal</text>

  <path fill="none" stroke="#e79654" stroke-width="1.75" stroke-dasharray="1 5.5" stroke-linecap="round" marker-end="url(#arrow-feedback-dark)"
        d="M 552,338 C 660,300 660,120 548,66" />
  <text class="mono" x="682" y="205" font-size="11.5" letter-spacing="0.3" fill="#e79654" text-anchor="middle" transform="rotate(90 682 205)">reinforced understanding</text>

  <!-- Structural flow -->
  <path fill="none" stroke="#85a4e8" stroke-width="1.75" marker-start="url(#arrow-flow-dark)" marker-end="url(#arrow-flow-dark)"
        d="M 360,118 L 360,150" />
  <path fill="none" stroke="#85a4e8" stroke-width="1.75" marker-end="url(#arrow-flow-dark)" d="M 330,210 L 250,300" />
  <path fill="none" stroke="#85a4e8" stroke-width="1.75" marker-end="url(#arrow-flow-dark)" d="M 390,210 L 470,300" />

  <!-- Agent Control Plane -->
  <rect x="230" y="34" width="260" height="64" rx="8" fill="#202a35" stroke="#85a4e8" stroke-width="1.4" />
  <text x="360" y="60" font-size="15" font-weight="650" fill="#e8edf3" letter-spacing="-0.1" text-anchor="middle">Agent Control Plane</text>
  <text class="mono" x="360" y="80" font-size="10.5" letter-spacing="0.3" fill="#94a4b5" text-anchor="middle">governs execution</text>

  <!-- Shared Contracts & Schemas -->
  <rect x="220" y="152" width="280" height="58" rx="8" fill="#1a222c" stroke="#2c3948" />
  <text x="360" y="176" font-size="15" font-weight="650" fill="#e8edf3" letter-spacing="-0.1" text-anchor="middle">Shared Contracts &amp; Schemas</text>
  <text class="mono" x="360" y="195" font-size="10.5" letter-spacing="0.3" fill="#94a4b5" text-anchor="middle">typed interface between planes</text>

  <!-- Inference Telemetry -->
  <rect x="120" y="302" width="220" height="64" rx="8" fill="#1a222c" stroke="#2c3948" />
  <text x="230" y="328" font-size="15" font-weight="650" fill="#e8edf3" letter-spacing="-0.1" text-anchor="middle">Inference Telemetry</text>
  <text class="mono" x="230" y="348" font-size="10.5" letter-spacing="0.3" fill="#94a4b5" text-anchor="middle">observes execution</text>

  <!-- Developer Learning -->
  <rect x="380" y="302" width="220" height="64" rx="8" fill="#1a222c" stroke="#2c3948" />
  <text x="490" y="328" font-size="15" font-weight="650" fill="#e8edf3" letter-spacing="-0.1" text-anchor="middle">Developer Learning</text>
  <text class="mono" x="490" y="348" font-size="10.5" letter-spacing="0.3" fill="#94a4b5" text-anchor="middle">reinforces understanding</text>

  <!-- Legend -->
  <line x1="248" y1="418" x2="278" y2="418" stroke="#85a4e8" stroke-width="2" />
  <text x="286" y="422" font-size="14" fill="#94a4b5">control &amp; contract flow</text>

  <line x1="248" y1="446" x2="278" y2="446" stroke="#e79654" stroke-width="2" />
  <text x="286" y="450" font-size="14" fill="#94a4b5">feedback — telemetry</text>

  <line x1="248" y1="474" x2="278" y2="474" stroke="#e79654" stroke-width="2.5" stroke-dasharray="1 5" stroke-linecap="round" />
  <text x="286" y="478" font-size="14" fill="#94a4b5">feedback — developer learning</text>
</svg>
