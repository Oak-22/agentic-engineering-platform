<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img" aria-labelledby="title description">
  <title id="title">Developer learning retrieval loop</title>
  <desc id="description">Engineering activity produces learning signals that become spaced active-recall prompts. Retrieval outcomes reinforce durable understanding and improve future engineering workflows.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#7c3aed"/></marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
      .name { font-family: Arial, Helvetica, sans-serif; font-size: 26px; font-weight: 700; fill: #0f172a; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 20px; fill: #334155; }
      .step { font-family: Arial, Helvetica, sans-serif; font-size: 19px; font-weight: 700; fill: #7c3aed; letter-spacing: 1px; }
      .card { fill: #ffffff; stroke: #94a3b8; stroke-width: 2.5; }
      .loop { fill: none; stroke: #7c3aed; stroke-width: 5; marker-end: url(#arrow); }
      .goal { fill: #ede9fe; stroke: #7c3aed; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1400" height="1050" fill="#f8fafc"/>
  <text x="700" y="75" text-anchor="middle" class="title" font-size="36" font-weight="700">Developer Learning Retrieval Loop</text>
  <text x="700" y="112" text-anchor="middle" class="title" font-size="22" fill="#475569">Turn real engineering work into durable understanding without interrupting delivery.</text>

  <g transform="translate(0 30)">
    <rect x="490" y="128" width="420" height="190" rx="22" class="card"/>
    <text x="700" y="169" text-anchor="middle" class="step">01 · CAPTURE</text>
    <text x="700" y="211" text-anchor="middle" class="name">Work-derived Signals</text>
    <text x="700" y="247" text-anchor="middle" class="body">Commits · debugging · agent runs</text>
    <text x="700" y="275" text-anchor="middle" class="body">Concepts, corrections, and decisions</text>

    <rect x="758" y="680" width="420" height="190" rx="22" class="card"/>
    <text x="968" y="721" text-anchor="middle" class="step">02 · RETRIEVE</text>
    <text x="968" y="763" text-anchor="middle" class="name">Spaced Recall Session</text>
    <text x="968" y="799" text-anchor="middle" class="body">Short prompt grounded in recent work</text>
    <text x="968" y="827" text-anchor="middle" class="body">Attempt first · explanation afterward</text>

    <rect x="222" y="680" width="420" height="190" rx="22" class="card"/>
    <text x="432" y="721" text-anchor="middle" class="step">03 · REINFORCE</text>
    <text x="432" y="763" text-anchor="middle" class="name">Durable Understanding</text>
    <text x="432" y="799" text-anchor="middle" class="body">Confidence · misconceptions · outcomes</text>
    <text x="432" y="827" text-anchor="middle" class="body">Knowledge base and workflow improvement</text>

    <circle cx="700" cy="500" r="140" class="goal"/>
    <text x="700" y="450" text-anchor="middle" class="title" font-size="25" font-weight="700" fill="#5b21b6">Learning goal</text>
    <text x="700" y="492" text-anchor="middle" class="title" font-size="21" font-weight="700" fill="#5b21b6">Retain the why</text>
    <text x="700" y="519" text-anchor="middle" class="title" font-size="21" font-weight="700" fill="#5b21b6">behind the work</text>
    <text x="700" y="560" text-anchor="middle" class="title" font-size="17" fill="#6d28d9">while preserving AI productivity</text>

    <path d="M900 340 C1050 350 1120 450 1000 565" class="loop"/>
    <path d="M968 892 C820 930 580 930 432 892" class="loop"/>
    <path d="M400 565 C280 450 350 350 500 340" class="loop"/>

    <text x="700" y="980" text-anchor="middle" class="title" font-size="20" fill="#475569">Telemetry supplies the signal; retrieval practice turns completion into learning.</text>
  </g>
</svg>
