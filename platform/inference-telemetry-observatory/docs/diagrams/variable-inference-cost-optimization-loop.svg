<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img" aria-labelledby="title description">
  <title id="title">Variable inference cost optimization loop</title>
  <desc id="description">Use provider-ledger evidence as the authoritative account-level spend baseline, supported by localized execution telemetry that attributes inference cost to models, projects, agents, runs, and workflow outcomes.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#0f766e"/></marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
      .name { font-family: Arial, Helvetica, sans-serif; font-size: 26px; font-weight: 700; fill: #0f172a; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 20px; fill: #334155; }
      .step { font-family: Arial, Helvetica, sans-serif; font-size: 19px; font-weight: 700; fill: #0f766e; letter-spacing: 1px; }
      .card { fill: #ffffff; stroke: #94a3b8; stroke-width: 2.5; }
      .loop { fill: none; stroke: #0f766e; stroke-width: 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="1050" fill="#f8fafc"/>
  <text x="700" y="75" text-anchor="middle" class="title" font-size="36" font-weight="700">Variable Inference Cost Optimization Loop</text>
  <text x="700" y="112" text-anchor="middle" class="title" font-size="22" fill="#475569">Provider-ledger baseline supported by localized execution telemetry</text>

  <g transform="translate(0 30)">
  <rect x="490" y="128" width="420" height="190" rx="22" class="card"/>
  <text x="700" y="169" text-anchor="middle" class="step">01 · MEASURE</text>
  <text x="700" y="211" text-anchor="middle" class="name">Provider Cost Ledger</text>
  <text x="700" y="247" text-anchor="middle" class="body">Spend by provider, model, time, and account</text>
  <text x="700" y="275" text-anchor="middle" class="body">Authoritative variable-cost baseline</text>

  <rect x="758" y="680" width="420" height="190" rx="22" class="card"/>
  <text x="968" y="721" text-anchor="middle" class="step">02 · EXPLAIN</text>
  <text x="968" y="763" text-anchor="middle" class="name">Observatory Analysis</text>
  <text x="968" y="799" text-anchor="middle" class="body">Localized execution telemetry</text>
  <text x="968" y="827" text-anchor="middle" class="body">Models · projects · agents · runs · outcomes</text>

  <rect x="222" y="680" width="420" height="190" rx="22" class="card"/>
  <text x="432" y="721" text-anchor="middle" class="step">03 · INTERVENE</text>
  <text x="432" y="763" text-anchor="middle" class="name">Engineering Action</text>
  <text x="432" y="799" text-anchor="middle" class="body">Reduce context · prompt/result caching</text>
  <text x="432" y="827" text-anchor="middle" class="body">Change defaults · remove retries</text>

  <circle cx="700" cy="500" r="140" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
  <text x="700" y="450" text-anchor="middle" class="title" font-size="25" font-weight="700" fill="#115e59">Decision goal</text>
  <text x="700" y="492" text-anchor="middle" class="title" font-size="21" font-weight="700" fill="#115e59">Lower variable</text>
  <text x="700" y="519" text-anchor="middle" class="title" font-size="21" font-weight="700" fill="#115e59">inference cost</text>
  <text x="700" y="560" text-anchor="middle" class="title" font-size="17" fill="#134e4a">while preserving outcomes</text>

  <path d="M900 340 C1050 350 1120 450 1000 565" class="loop"/>
  <path d="M968 892 C820 930 580 930 432 892" class="loop"/>
  <path d="M400 565 C280 450 350 350 500 340" class="loop"/>

  <text x="700" y="980" text-anchor="middle" class="title" font-size="20" fill="#475569">Every intervention is measured against the next provider-ledger period.</text>
  </g>
</svg>
