<svg viewBox="0 -66 780 878" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agent Control Plane: governance aperture and assurance spectrum</title>
  <desc id="desc">Codex, Claude, and open-source agent runtimes produce divergent contributions. Most pass through the Agent Control Plane, a governance aperture that turns them into coherent, aligned execution; some bypass it entirely and drift, and — in one flagged case — two separate drift vectors from Codex converge on the same ungoverned outcome: one that never enters the Agent Control Plane at all, and one that passes through it yet still leaves as residual risk. Inside the Agent Control Plane, control artifacts sit on an assurance spectrum whose positions — interpretive, procedural, machine-validated, mechanically enforced — are places a control can occupy rather than stages it converts through; moving rightward buys stronger assurance at the cost of narrower judgment, so the weakest position a control’s risk tolerates is the correct one. The Agent Control Plane also owns portable contracts that MCP adapters project outward to external systems such as Jira and GitHub. The mechanically enforced tier feeds verified evidence back into the deterministic guardrail, which in turn hardens the Agent Control Plane’s own governance. Below, a Shared Contracts and Schemas interface layer provides versioned interfaces for concrete cross-platform-domain exchanges. This is a scoped view: the peer Inference Telemetry and Developer Learning domains, their feedback loops, and the shared delivery outcome are shown in the full platform diagram.</desc>
  <style>
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #c9d4e0; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .tag { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #9db0c4; letter-spacing: 0.5px; }
    .dim { fill: #9db0c4; }
  </style>
  <defs>
    <marker id="arrow-flow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#85a4e8" />
    </marker>
    <marker id="arrow-feedback" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e79654" />
    </marker>
    <marker id="arrow-guardrail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5ec9a5" />
    </marker>
    <marker id="arrow-bypass" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b80" />
    </marker>
    <marker id="arrow-warning" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e2574c" />
    </marker>
  </defs>

  <rect x="0" y="-66" width="780" height="878" fill="#0b0f14" />

  <text x="390" y="-38" font-size="24" font-weight="700" text-anchor="middle" fill="#e8edf5" letter-spacing="0.2">Agentic Engineering Platform</text>

  <text x="390" y="-16" font-size="11.5" text-anchor="middle" fill="#9db0c4" letter-spacing="0.3">Probabilistic Engine + Deterministic Scaffold</text>

  <text x="390" y="14" class="tag" font-size="9.5" text-anchor="middle" letter-spacing="1.2">DIVERGENT MODEL CONTRIBUTIONS</text>

  <!-- ============ Runtimes (contribution sources) ============ -->
  <g>
    <rect x="60" y="24" width="190" height="48" rx="24" fill="#1a222c" stroke="#5b6b80" stroke-width="1.2" stroke-dasharray="3 3" />
    <text x="155" y="45" font-size="13" font-weight="650" text-anchor="middle">Codex</text>
    <text x="155" y="60" class="mono dim" font-size="8" text-anchor="middle">contribution source</text>

    <rect x="295" y="24" width="190" height="48" rx="24" fill="#1a222c" stroke="#5b6b80" stroke-width="1.2" stroke-dasharray="3 3" />
    <text x="390" y="45" font-size="13" font-weight="650" text-anchor="middle">Claude</text>
    <text x="390" y="60" class="mono dim" font-size="8" text-anchor="middle">contribution source</text>

    <rect x="530" y="24" width="190" height="48" rx="24" fill="#1a222c" stroke="#5b6b80" stroke-width="1.2" stroke-dasharray="3 3" />
    <text x="625" y="45" font-size="13" font-weight="650" text-anchor="middle">Open-source agents</text>
    <text x="625" y="60" class="mono dim" font-size="8" text-anchor="middle">contribution source</text>
  </g>

  <!-- ============ Governed beams: runtimes -> ACP aperture ============ -->
  <path fill="none" stroke="#85a4e8" stroke-width="1.5" opacity="0.9" marker-end="url(#arrow-flow)" d="M 155,72 C 155,120 210,155 250,202" />
  <path fill="none" stroke="#85a4e8" stroke-width="1.5" opacity="0.9" marker-end="url(#arrow-flow)" d="M 390,72 L 390,202" />
  <path fill="none" stroke="#85a4e8" stroke-width="1.5" opacity="0.9" marker-end="url(#arrow-flow)" d="M 625,72 C 625,120 570,155 530,202" />

  <!-- ============ Bypass / drift beams — two vectors, one outcome ============ -->
  <!-- A: left-most — drift that never enters the Agent Control Plane -->
  <path fill="none" stroke="#5b6b80" stroke-width="1.3" opacity="0.5" d="M 100,72 C 55,200 50,430 62,556" />
  <text x="34" y="290" class="mono" font-size="7.5" fill="#8797ab" text-anchor="middle" transform="rotate(-90 34 290)">drift</text>

  <!-- C: right-most — drift that passes through the Agent Control Plane (around the governance tag) and still ends up ungoverned -->
  <path fill="none" stroke="#5b6b80" stroke-width="1.3" opacity="0.45" d="M 205,72 C 270,120 350,175 350,202 C 345,255 300,310 250,340 C 200,410 140,500 78,556" />

  <!-- converged path — both vectors arrive at the same flagged outcome -->
  <path fill="none" stroke="#5b6b80" stroke-width="1.3" opacity="0.4" d="M 70,556 C 57,586 45,614 40,636" />
  <path fill="none" stroke="#e2574c" stroke-width="1.75" marker-end="url(#arrow-warning)" d="M 40,636 L 40,664" />
  <polygon points="40,671 33,684 47,684" fill="none" stroke="#e2574c" stroke-width="1.3" />
  <text x="40" y="682" font-size="8" fill="#e2574c" text-anchor="middle" font-weight="700">!</text>
  <text x="55" y="701" class="mono" font-size="7.5" fill="#e2574c" text-anchor="middle">residual risk:</text>
  <text x="55" y="712" class="mono" font-size="7.5" fill="#e2574c" text-anchor="middle">ungoverned delivery</text>

  <!-- ============ Agent Control Plane (aperture) ============ -->
  <rect x="170" y="202" width="440" height="100" rx="10" fill="#202a35" stroke="#85a4e8" stroke-width="1.6" />
  <text x="182" y="216" class="tag" font-size="7.5" letter-spacing="0.6">PLATFORM DOMAIN · GOVERNANCE</text>
  <text x="390" y="240" font-size="17" font-weight="650" text-anchor="middle" letter-spacing="-0.1">Agent Control Plane</text>
  <text x="390" y="258" class="mono dim" font-size="10" text-anchor="middle">coherence &amp; governance aperture</text>
  <text x="390" y="278" class="mono dim" font-size="8" text-anchor="middle">instructions · authority · ordering · verification</text>
  <text x="390" y="290" class="mono dim" font-size="8" text-anchor="middle">provenance · review boundaries</text>

  <path fill="none" stroke="#85a4e8" stroke-width="1.5" marker-end="url(#arrow-flow)" d="M 390,302 L 390,356" />

  <!-- ============ Outward projection: ACP-owned portable contracts -> external systems ============ -->
  <rect x="626" y="98" width="136" height="42" rx="8" fill="#1a222c" stroke="#85a4e8" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.95" />
  <text x="694" y="115" font-size="10" font-weight="650" text-anchor="middle">MCP · adapters</text>
  <text x="694" y="129" class="mono dim" font-size="7" text-anchor="middle">Jira · GitHub</text>

  <path fill="none" stroke="#85a4e8" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow-flow)" d="M 610,214 C 638,212 652,192 658,145" />
  <text x="666" y="188" class="mono dim" font-size="7" text-anchor="start">portable contracts</text>
  <text x="666" y="197" class="mono dim" font-size="7" text-anchor="start">projected outward</text>

  <!-- ============ Guardrail node + mechanization loop ============ -->
  <rect x="624" y="222" width="94" height="42" rx="8" fill="#163f36" stroke="#5ec9a5" stroke-width="1.3" />
  <text x="671" y="239" font-size="10" font-weight="650" text-anchor="middle">guardrail</text>
  <text x="671" y="251" class="mono" font-size="7" fill="#8fd6bd" text-anchor="middle">deterministic</text>

  <path fill="none" stroke="#5ec9a5" stroke-width="1.3" marker-end="url(#arrow-guardrail)" d="M 660,222 C 660,187 590,187 560,202" />
  <text x="615" y="170" class="mono" font-size="7" fill="#5ec9a5" text-anchor="middle">guardrail hardens</text>
  <text x="615" y="180" class="mono" font-size="7" fill="#5ec9a5" text-anchor="middle">governance</text>

  <path fill="none" stroke="#5ec9a5" stroke-width="1.3" stroke-dasharray="1 4" stroke-linecap="round" marker-end="url(#arrow-guardrail)" d="M 610,462 C 668,462 668,300 645,264" />
  <text x="665" y="352" class="mono" font-size="7" fill="#5ec9a5" text-anchor="middle">verified evidence</text>
  <text x="665" y="362" class="mono" font-size="7" fill="#5ec9a5" text-anchor="middle">strengthens guardrail</text>

  <!-- ============ Assurance spectrum ============ -->
  <rect x="170" y="362" width="440" height="80" rx="8" fill="#171e26" stroke="#2c3948" />
  <text x="390" y="377" font-size="10" font-weight="650" text-anchor="middle" fill="#94a4b5">control-artifact assurance spectrum</text>
  <text x="182" y="377" class="mono dim" font-size="6.5" text-anchor="start">◄ wider judgment</text>
  <text x="598" y="377" class="mono dim" font-size="6.5" text-anchor="end">stronger assurance ►</text>

  <rect x="182" y="386" width="98" height="42" rx="6" fill="#22303f" stroke="#4a6a9a" stroke-width="1.1" />
  <text x="231" y="402" font-size="8.5" font-weight="650" text-anchor="middle">Interpretive</text>
  <text x="231" y="416" class="mono dim" font-size="6.5" text-anchor="middle">instructions, prompts</text>

  <line x1="286" y1="392" x2="286" y2="422" stroke="#4a5a6d" stroke-width="1" />

  <rect x="292" y="386" width="98" height="42" rx="6" fill="#223a44" stroke="#5a86a8" stroke-width="1.1" />
  <text x="341" y="402" font-size="8.5" font-weight="650" text-anchor="middle">Procedural</text>
  <text x="341" y="416" class="mono dim" font-size="6.5" text-anchor="middle">skills, workflows</text>

  <line x1="396" y1="392" x2="396" y2="422" stroke="#4a5a6d" stroke-width="1" />

  <rect x="402" y="386" width="98" height="42" rx="6" fill="#1f3a4a" stroke="#6fa0c8" stroke-width="1.1" />
  <text x="451" y="399" font-size="8.5" font-weight="650" text-anchor="middle">Machine-</text>
  <text x="451" y="409" font-size="8.5" font-weight="650" text-anchor="middle">validated</text>
  <text x="451" y="422" class="mono dim" font-size="6.5" text-anchor="middle">schemas, hook defs</text>

  <line x1="506" y1="392" x2="506" y2="422" stroke="#4a5a6d" stroke-width="1" />

  <rect x="512" y="386" width="98" height="42" rx="6" fill="#163f36" stroke="#5ec9a5" stroke-width="1.1" />
  <text x="561" y="399" font-size="8.5" font-weight="650" text-anchor="middle">Mechanically</text>
  <text x="561" y="409" font-size="8.5" font-weight="650" text-anchor="middle">enforced</text>
  <text x="561" y="422" class="mono" font-size="6.5" fill="#8fd6bd" text-anchor="middle">bounded scripts, CI</text>

  <path fill="none" stroke="#85a4e8" stroke-width="1.5" marker-end="url(#arrow-flow)" d="M 390,442 L 390,496" />

  <!-- ============ Shared Contracts & Schemas — connective tissue ============ -->
  <rect x="110" y="502" width="560" height="34" rx="17" fill="none" stroke="#85a4e8" stroke-width="1.2" stroke-dasharray="2 5" stroke-linecap="round" opacity="0.85" />
  <text x="390" y="516" font-size="11.5" font-weight="650" text-anchor="middle">Shared Contracts &amp; Schemas</text>
  <text x="390" y="529" class="mono dim" font-size="7.5" text-anchor="middle">versioned interfaces for concrete cross-platform-domain exchanges</text>

  <!-- ============ Legend ============ -->
  <line x1="110" y1="770" x2="140" y2="770" stroke="#85a4e8" stroke-width="2" />
  <text x="148" y="774" font-size="11.5" class="dim">governed structural flow</text>

  <line x1="110" y1="790" x2="140" y2="790" stroke="#5b6b80" stroke-width="1.6" stroke-dasharray="2 4" />
  <text x="148" y="794" font-size="11.5" class="dim">bypass / drift (undesired)</text>

  <line x1="420" y1="770" x2="450" y2="770" stroke="#e2574c" stroke-width="1.6" />
  <text x="458" y="774" font-size="11.5" class="dim">residual risk — ungoverned delivery</text>

  <line x1="420" y1="790" x2="450" y2="790" stroke="#5ec9a5" stroke-width="2" />
  <text x="458" y="794" font-size="11.5" class="dim">mechanization loop — deterministic guardrails</text>
</svg>
