<svg viewBox="0 -48 780 1158" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agent Control Plane: coherence-transforming system diagram</title>
  <desc id="desc">Codex, Claude, and open-source agent runtimes produce divergent contributions. Most pass through the Agent Control Plane, a governance aperture that turns them into coherent, aligned execution; some bypass it entirely and drift, others are redirected into a deterministic guardrail, and — in one flagged case — two separate drift vectors from Codex converge on the same ungoverned outcome: one that never enters the Agent Control Plane at all, and one that passes through it yet still crosses the delivery boundary ungoverned as residual risk. The Agent Control Plane, Inference Telemetry, and Developer Learning are three peer platform domains, drawn with the same card treatment, linked by a Shared Contracts and Schemas interface layer that provides versioned interfaces for concrete cross-platform-domain exchanges rather than a universal type system. Inside the Agent Control Plane, control artifacts sit on an assurance spectrum from interpretive guidance through procedural, machine-validated, to mechanically enforced; the mechanically enforced tier feeds verified evidence back into the deterministic guardrail, which in turn intercepts future recurring contributions before they need full governance review. Three feedback paths return to the Agent Control Plane: an observed-execution loop from Inference Telemetry, a reinforced-understanding loop from Developer Learning, and a mechanization loop whose deterministic guardrails, once hardened by verified evidence, feed back to strengthen the Agent Control Plane's own governance authority. All three domains converge on an outcome region: predictable, accelerated delivery.</desc>
  <style>
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #c9d4e0; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .tag { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #6a7c8f; letter-spacing: 0.5px; }
    .dim { fill: #6a7c8f; }
  </style>
  <defs>
    <marker id="arrow-flow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#85a4e8" />
    </marker>
    <marker id="arrow-feedback" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e79654" />
    </marker>
    <marker id="arrow-guardrail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5ec9a5" />
    </marker>
    <marker id="arrow-bypass" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b80" />
    </marker>
    <marker id="arrow-warning" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e2574c" />
    </marker>
  </defs>

  <rect x="0" y="-48" width="780" height="1158" fill="#0b0f14" />

  <text x="390" y="-20" font-size="24" font-weight="700" text-anchor="middle" fill="#e8edf5" letter-spacing="0.2">Agentic Engineering Platform</text>

  <text x="390" y="14" class="tag" font-size="9.5" text-anchor="middle" letter-spacing="1.2">DIVERGENT MODEL CONTRIBUTIONS</text>

  <!-- ============ Runtimes (contribution sources) ============ -->
  <g>
    <rect x="60" y="24" width="190" height="48" rx="24" fill="#1a222c" stroke="#5b6b80" stroke-width="1.2" stroke-dasharray="3 3" />
    <text x="155" y="45" font-size="13" font-weight="650" text-anchor="middle">Codex</text>
    <text x="155" y="60" class="mono dim" font-size="8" text-anchor="middle">contribution source</text>

    <rect x="295" y="24" width="190" height="48" rx="24" fill="#1a222c" stroke="#5b6b80" stroke-width="1.2" stroke-dasharray="3 3" />
    <text x="390" y="45" font-size="13" font-weight="650" text-anchor="middle">Claude</text>
    <text x="390" y="60" class="mono dim" font-size="8" text-anchor="middle">contribution source</text>

    <rect x="530" y="24" width="190" height="48" rx="24" fill="#1a222c" stroke="#5b6b80" stroke-width="1.2" stroke-dasharray="3 3" />
    <text x="625" y="45" font-size="13" font-weight="650" text-anchor="middle">Open-source agents</text>
    <text x="625" y="60" class="mono dim" font-size="8" text-anchor="middle">contribution source</text>
  </g>

  <!-- ============ Governed beams: runtimes -> ACP aperture ============ -->
  <path fill="none" stroke="#85a4e8" stroke-width="1.5" opacity="0.9" marker-end="url(#arrow-flow)" d="M 155,72 C 155,105 220,120 250,150" />
  <path fill="none" stroke="#85a4e8" stroke-width="1.5" opacity="0.9" marker-end="url(#arrow-flow)" d="M 390,72 L 390,150" />
  <path fill="none" stroke="#85a4e8" stroke-width="1.5" opacity="0.9" marker-end="url(#arrow-flow)" d="M 625,72 C 625,105 560,120 530,150" />

  <!-- ============ Bypass / drift beams — two vectors, one outcome ============ -->
  <!-- A: left-most — drift that never enters the Agent Control Plane -->
  <path fill="none" stroke="#5b6b80" stroke-width="1.3" opacity="0.5" d="M 100,72 C 55,140 50,260 62,400" />
  <text x="34" y="230" class="mono" font-size="7.5" fill="#5b6b80" text-anchor="middle" transform="rotate(-90 34 230)">drift</text>

  <!-- B: redirected into deterministic guardrail -->
  <path fill="none" stroke="#5b6b80" stroke-width="1.3" opacity="0.55" marker-end="url(#arrow-bypass)" d="M 660,72 C 690,110 685,140 675,168" />
  <text x="702" y="120" class="mono" font-size="7" fill="#5b6b80" text-anchor="middle">recurring pattern</text>
  <text x="702" y="130" class="mono" font-size="7" fill="#5b6b80" text-anchor="middle">→ direct guardrail</text>

  <!-- C: right-most — drift that passes through the Agent Control Plane (around the governance tag) and still ends up ungoverned -->
  <path fill="none" stroke="#5b6b80" stroke-width="1.3" opacity="0.45" d="M 205,72 C 270,110 350,130 350,150 C 345,190 300,230 250,250 C 200,300 140,360 78,400" />

  <!-- converged path — both vectors arrive at the same flagged outcome -->
  <path fill="none" stroke="#5b6b80" stroke-width="1.3" opacity="0.4" d="M 70,400 C 55,600 42,780 40,900" />
  <path fill="none" stroke="#e2574c" stroke-width="1.75" marker-end="url(#arrow-warning)" d="M 40,900 L 40,928" />
  <polygon points="40,935 33,948 47,948" fill="none" stroke="#e2574c" stroke-width="1.3" />
  <text x="40" y="946" font-size="8" fill="#e2574c" text-anchor="middle" font-weight="700">!</text>
  <text x="55" y="965" class="mono" font-size="7.5" fill="#e2574c" text-anchor="middle">residual risk:</text>
  <text x="55" y="976" class="mono" font-size="7.5" fill="#e2574c" text-anchor="middle">ungoverned delivery</text>

  <!-- ============ Agent Control Plane (aperture) ============ -->
  <rect x="170" y="150" width="440" height="100" rx="10" fill="#202a35" stroke="#85a4e8" stroke-width="1.6" />
  <text x="182" y="164" class="tag" font-size="7.5" letter-spacing="0.6">PLATFORM DOMAIN · GOVERNANCE</text>
  <text x="390" y="188" font-size="17" font-weight="650" text-anchor="middle" letter-spacing="-0.1">Agent Control Plane</text>
  <text x="390" y="206" class="mono dim" font-size="10" text-anchor="middle">coherence &amp; governance aperture</text>
  <text x="390" y="226" class="mono dim" font-size="8" text-anchor="middle">instructions · authority · ordering · verification</text>
  <text x="390" y="238" class="mono dim" font-size="8" text-anchor="middle">provenance · review boundaries</text>

  <path fill="none" stroke="#85a4e8" stroke-width="1.5" marker-end="url(#arrow-flow)" d="M 390,250 L 390,260" />

  <!-- ============ Guardrail node + mechanization loop ============ -->
  <rect x="624" y="170" width="94" height="42" rx="8" fill="#163f36" stroke="#5ec9a5" stroke-width="1.3" />
  <text x="671" y="187" font-size="10" font-weight="650" text-anchor="middle">guardrail</text>
  <text x="671" y="199" class="mono" font-size="7" fill="#8fd6bd" text-anchor="middle">deterministic</text>

  <path fill="none" stroke="#5ec9a5" stroke-width="1.3" marker-end="url(#arrow-guardrail)" d="M 660,170 C 660,135 590,135 560,150" />
  <text x="610" y="132" class="mono" font-size="7" fill="#5ec9a5" text-anchor="middle">guardrail hardens</text>
  <text x="610" y="142" class="mono" font-size="7" fill="#5ec9a5" text-anchor="middle">governance</text>

  <path fill="none" stroke="#5ec9a5" stroke-width="1.3" stroke-dasharray="1 4" stroke-linecap="round" marker-end="url(#arrow-guardrail)" d="M 610,310 C 665,310 665,240 645,212" />
  <text x="665" y="262" class="mono" font-size="7" fill="#5ec9a5" text-anchor="middle">verified evidence</text>
  <text x="665" y="272" class="mono" font-size="7" fill="#5ec9a5" text-anchor="middle">strengthens guardrail</text>

  <!-- ============ Assurance spectrum ============ -->
  <rect x="170" y="266" width="440" height="80" rx="8" fill="#171e26" stroke="#2c3948" />
  <text x="390" y="281" font-size="10" font-weight="650" text-anchor="middle" fill="#94a4b5">control-artifact assurance spectrum</text>

  <rect x="182" y="290" width="98" height="42" rx="6" fill="#22303f" stroke="#4a6a9a" stroke-width="1.1" />
  <text x="231" y="306" font-size="8.5" font-weight="650" text-anchor="middle">Interpretive</text>
  <text x="231" y="320" class="mono dim" font-size="6.5" text-anchor="middle">instructions, prompts</text>

  <text x="286" y="313" class="dim" font-size="10" text-anchor="middle">→</text>

  <rect x="292" y="290" width="98" height="42" rx="6" fill="#223a44" stroke="#5a86a8" stroke-width="1.1" />
  <text x="341" y="306" font-size="8.5" font-weight="650" text-anchor="middle">Procedural</text>
  <text x="341" y="320" class="mono dim" font-size="6.5" text-anchor="middle">skills, workflows</text>

  <text x="396" y="313" class="dim" font-size="10" text-anchor="middle">→</text>

  <rect x="402" y="290" width="98" height="42" rx="6" fill="#1f3a4a" stroke="#6fa0c8" stroke-width="1.1" />
  <text x="451" y="303" font-size="8.5" font-weight="650" text-anchor="middle">Machine-</text>
  <text x="451" y="313" font-size="8.5" font-weight="650" text-anchor="middle">validated</text>
  <text x="451" y="326" class="mono dim" font-size="6.5" text-anchor="middle">schemas, hook defs</text>

  <text x="506" y="313" fill="#5ec9a5" font-size="10" text-anchor="middle">→</text>

  <rect x="512" y="290" width="98" height="42" rx="6" fill="#163f36" stroke="#5ec9a5" stroke-width="1.1" />
  <text x="561" y="303" font-size="8.5" font-weight="650" text-anchor="middle">Mechanically</text>
  <text x="561" y="313" font-size="8.5" font-weight="650" text-anchor="middle">enforced</text>
  <text x="561" y="326" class="mono" font-size="6.5" fill="#8fd6bd" text-anchor="middle">bounded scripts, CI</text>

  <path fill="none" stroke="#85a4e8" stroke-width="1.5" marker-end="url(#arrow-flow)" d="M 390,346 L 390,366" />

  <!-- ============ Shared Contracts & Schemas — connective tissue ============ -->
  <rect x="110" y="366" width="560" height="34" rx="17" fill="none" stroke="#85a4e8" stroke-width="1.2" stroke-dasharray="2 5" stroke-linecap="round" opacity="0.85" />
  <text x="390" y="380" font-size="11.5" font-weight="650" text-anchor="middle">Shared Contracts &amp; Schemas</text>
  <text x="390" y="393" class="mono dim" font-size="7.5" text-anchor="middle">versioned interfaces for concrete cross-platform-domain exchanges</text>

  <path fill="none" stroke="#85a4e8" stroke-width="1.5" marker-end="url(#arrow-flow)" d="M 390,400 C 390,412 320,420 250,430" />
  <path fill="none" stroke="#85a4e8" stroke-width="1.5" marker-end="url(#arrow-flow)" d="M 390,400 C 390,412 460,420 530,430" />

  <!-- ============ Inference Telemetry ============ -->
