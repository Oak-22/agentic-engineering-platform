<svg viewBox="0 -66 780 1072" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agent Control Plane: coherence-transforming system diagram</title>
  <desc id="desc">Codex, Claude, and open-source agent runtimes produce divergent contributions. Most pass through the Agent Control Plane, a governance aperture that turns them into coherent, aligned execution; some bypass it entirely and drift, and — in one flagged case — two separate drift vectors from Codex converge on the same ungoverned outcome: one that never enters the Agent Control Plane at all, and one that passes through it yet still crosses the delivery boundary ungoverned as residual risk. The Agent Control Plane, Inference Telemetry, and Developer Learning are three peer platform domains, drawn with the same card treatment, linked by a Shared Contracts and Schemas interface layer that provides versioned interfaces for concrete cross-platform-domain exchanges rather than a universal type system. Inside the Agent Control Plane, control artifacts sit on an assurance spectrum whose positions — interpretive, procedural, machine-validated, mechanically enforced — are places a control can occupy rather than stages it converts through; moving rightward buys stronger assurance at the cost of narrower judgment, so the weakest position a control's risk tolerates is the correct one. The Agent Control Plane also owns portable contracts that MCP adapters project outward to external systems such as Jira and GitHub, drawn as a dashed outbound path to an external adapter node. The mechanically enforced tier feeds verified evidence back into the deterministic guardrail, which in turn hardens the Agent Control Plane's own governance. Three feedback paths return to the Agent Control Plane: an observed-execution loop from Inference Telemetry and a reinforced-understanding loop from Developer Learning, both human-mediated — a maintainer reads those signals and proposes instruction or policy changes back through the ordinary pull-request lifecycle, and no automated return path is built — and a mechanization loop whose deterministic guardrails, once hardened by verified evidence, feed back to strengthen the Agent Control Plane's own governance authority. All three domains converge on an outcome region: predictable, accelerated delivery.</desc>
