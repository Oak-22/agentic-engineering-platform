  <text x="122" y="443" class="tag" font-size="7.5" letter-spacing="0.6">PLATFORM DOMAIN · TELEMETRY</text>
  <text x="245" y="466" font-size="15" font-weight="650" text-anchor="middle">Inference Telemetry</text>
  <text x="245" y="484" class="mono dim" font-size="9.5" text-anchor="middle">observes execution, efficiency &amp; outcomes</text>

  <!-- ============ Developer Learning ============ -->
  <rect x="400" y="430" width="270" height="90" rx="10" fill="#202a35" stroke="#85a4e8" stroke-width="1.4" />
  <text x="412" y="443" class="tag" font-size="7.5" letter-spacing="0.6">PLATFORM DOMAIN · LEARNING</text>
  <text x="535" y="466" font-size="15" font-weight="650" text-anchor="middle">Developer Learning</text>
  <text x="535" y="484" class="mono dim" font-size="9.5" text-anchor="middle">preserves &amp; reinforces engineering understanding</text>

  <!-- ============ Feedback: Inference Telemetry -> ACP (observed signal) ============ -->
  <path fill="none" stroke="#e79654" stroke-width="1.75" stroke-dasharray="1 5.5" stroke-linecap="round" marker-end="url(#arrow-feedback)" d="M 150,430 C 60,380 55,240 172,196" />
  <text x="44" y="300" class="mono" font-size="9.5" fill="#e79654" text-anchor="middle">OBSERVED SIGNAL</text>
  <text x="44" y="312" class="mono" font-size="9.5" fill="#e79654" text-anchor="middle">→ REFINEMENT</text>

  <!-- ============ Feedback: Developer Learning -> ACP (reinforced understanding) ============ -->
  <path fill="none" stroke="#e79654" stroke-width="1.75" stroke-dasharray="1 5.5" stroke-linecap="round" marker-end="url(#arrow-feedback)" d="M 630,430 C 720,380 725,240 608,196" />
  <text x="720" y="300" class="mono" font-size="9.5" fill="#e79654" text-anchor="middle">VALIDATED LEARNING</text>
  <text x="720" y="312" class="mono" font-size="9.5" fill="#e79654" text-anchor="middle">→ CURATED PRACTICES</text>

  <!-- ============ Convergence into delivery outcome ============ -->
  <path fill="none" stroke="#85a4e8" stroke-width="1.5" marker-end="url(#arrow-flow)" d="M 245,520 L 245,930" />
  <path fill="none" stroke="#85a4e8" stroke-width="1.5" stroke-dasharray="1 5" d="M 390,400 L 390,930" />
  <path fill="none" stroke="#85a4e8" stroke-width="1.5" marker-end="url(#arrow-flow)" d="M 535,520 L 535,930" />

  <!-- ============ Delivery outcome ============ -->
  <rect x="110" y="930" width="560" height="100" rx="10" fill="#202a35" stroke="#85a4e8" stroke-width="1.6" />
  <text x="390" y="958" font-size="16" font-weight="650" text-anchor="middle">Predictable, accelerated delivery</text>
  <text x="245" y="985" class="mono dim" font-size="8.5" text-anchor="middle">shaped &amp; governed</text>
  <text x="245" y="997" class="mono dim" font-size="8.5" text-anchor="middle">delivery units</text>
  <text x="390" y="985" class="mono dim" font-size="8.5" text-anchor="middle">reviewed, production-</text>
  <text x="390" y="997" class="mono dim" font-size="8.5" text-anchor="middle">grade artifacts</text>
  <text x="535" y="985" class="mono dim" font-size="8.5" text-anchor="middle">retained engineering</text>
  <text x="535" y="997" class="mono dim" font-size="8.5" text-anchor="middle">understanding</text>

  <!-- ============ Legend ============ -->
  <line x1="110" y1="1054" x2="140" y2="1054" stroke="#85a4e8" stroke-width="2" />
  <text x="148" y="1058" font-size="11.5" class="dim">governed structural flow</text>

  <line x1="110" y1="1074" x2="140" y2="1074" stroke="#5b6b80" stroke-width="1.6" stroke-dasharray="2 4" />
  <text x="148" y="1078" font-size="11.5" class="dim">bypass / drift contribution</text>

  <line x1="110" y1="1094" x2="140" y2="1094" stroke="#e2574c" stroke-width="1.6" />
  <text x="148" y="1098" font-size="11.5" class="dim">residual risk — ungoverned delivery</text>

  <line x1="420" y1="1054" x2="450" y2="1054" stroke="#e79654" stroke-width="2.5" stroke-dasharray="1 5" stroke-linecap="round" />
  <text x="458" y="1058" font-size="11.5" class="dim">feedback — observed signal (telemetry)</text>

  <line x1="420" y1="1074" x2="450" y2="1074" stroke="#e79654" stroke-width="2.5" stroke-dasharray="1 5" stroke-linecap="round" />
  <text x="458" y="1078" font-size="11.5" class="dim">feedback — reinforced understanding (learning)</text>

  <line x1="420" y1="1094" x2="450" y2="1094" stroke="#5ec9a5" stroke-width="2" />
  <text x="458" y="1098" font-size="11.5" class="dim">mechanization loop — deterministic guardrails</text>
</svg>
