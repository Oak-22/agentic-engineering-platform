name: AEP Copilot Review Request

# Request orchestration is deliberately separate from the required gate. A
# request/deferred run must never create a skipped `aep-copilot-review` check.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["Control Plane Guards"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request to request after its guard check passes"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  actions: read
  checks: read

concurrency:
  # One request run at a time per pull request, whichever event started it,
  # so request runs for one pull request never execute concurrently. The
  # live-head check below is what keeps a superseded head from being requested.
  group: aep-copilot-review-request-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  request-copilot:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Request Copilot only after the exact guard passed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id || '' }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number || '' }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          if [ -n "${RUN_ID}" ]; then
            PR_NUMBER="$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}" --jq '.pull_requests[0].number // empty')"
            HEAD_SHA="$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}" --jq '.head_sha')"
            GUARD="$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}" --jq '.conclusion // empty')"
          else
            PR_NUMBER="${EVENT_PR_NUMBER}"
            HEAD_SHA="${EVENT_HEAD_SHA}"
          fi
          if [ -z "${PR_NUMBER}" ]; then
            echo "Guard run is not attached to a pull request; no review requested."
            exit 0
          fi
          # The review must target the live head. A guard run or pull_request
          # event describes the head as of when it was created; if the pull
          # request has advanced since, the newer head's own guard run
          # requests its review, and a request for the old head is only noise.
          LIVE_HEAD_SHA="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [ -z "${HEAD_SHA}" ]; then
            HEAD_SHA="${LIVE_HEAD_SHA}"
          elif [ "${HEAD_SHA}" != "${LIVE_HEAD_SHA}" ]; then
            echo "Head ${HEAD_SHA} from the triggering event is not the current head ${LIVE_HEAD_SHA} of pull request #${PR_NUMBER}; review request deferred to the current head's guard run."
            exit 0
          fi
          if [ -z "${GUARD:-}" ]; then
            GUARD="$(gh api "repos/${REPOSITORY}/commits/${HEAD_SHA}/check-runs" --jq '[.check_runs[] | select(.name == "control-plane-guards")] | sort_by(.completed_at // .started_at // .created_at) | last | .conclusion // empty')"
          fi
          if [ "${GUARD}" != "success" ]; then
            echo "control-plane-guards is ${GUARD:-pending} for ${HEAD_SHA}; review request deferred."
            exit 0
          fi
          gh api --method POST "repos/${REPOSITORY}/pulls/${PR_NUMBER}/requested_reviewers" \
            -f 'reviewers[]=copilot-pull-request-reviewer[bot]'
