name: AEP Copilot Review Gate

# This workflow has exactly one required job. GitHub triggers it for every
# submitted review, then the first steps resolve and validate the event as
# Copilot's exact head review. Unknown providers fail closed instead of
# producing a skipped required check.
#
# The manual dispatch is a recovery path, not a bypass: it takes an explicit
# pull request and review, resolves the live head, and runs the same
# validation. It exists because GitHub does not always create the
# pull_request_review run, and a required check that can never appear blocks
# the human merge just as hard as a failing one.
on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request whose current head the review must target"
        required: true
        type: string
      review_id:
        description: "Submitted Copilot review ID to evaluate"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: aep-copilot-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  aep-copilot-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve the review under evaluation
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          EVENT_REVIEW_ID: ${{ github.event.review.id || '' }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number || '' }}
          INPUT_REVIEW_ID: ${{ inputs.review_id || '' }}
          RUN_SHA: ${{ github.sha }}
        run: |
          PR_NUMBER="${EVENT_PR_NUMBER:-${INPUT_PR_NUMBER}}"
          REVIEW_ID="${EVENT_REVIEW_ID:-${INPUT_REVIEW_ID}}"
          if [ -z "${PR_NUMBER}" ] || [ -z "${REVIEW_ID}" ]; then
            echo "A pull request number and review ID are required." >&2
            exit 1
          fi
          HEAD_SHA="${EVENT_HEAD_SHA}"
          if [ -z "${HEAD_SHA}" ]; then
            # Manual recovery: the head comes from the live pull request, and the
            # dispatched ref must already be at that head so the check this run
            # produces lands on the exact commit it evaluated.
            HEAD_SHA="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
            if [ "${RUN_SHA}" != "${HEAD_SHA}" ]; then
              echo "Dispatched ref is at ${RUN_SHA}, not pull request head ${HEAD_SHA}; dispatch from the current head." >&2
              exit 1
            fi
          fi
          {
            echo "PR_NUMBER=${PR_NUMBER}"
            echo "REVIEW_ID=${REVIEW_ID}"
            echo "HEAD_SHA=${HEAD_SHA}"
          } >> "$GITHUB_ENV"

      - name: Validate the submitted review
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews/${REVIEW_ID}" > /tmp/copilot-event-review.json
          review_login="$(jq -r '.user.login // empty' /tmp/copilot-event-review.json)"
          review_commit="$(jq -r '.commit_id // empty' /tmp/copilot-event-review.json)"
          case "${review_login}" in
            copilot-pull-request-reviewer|'copilot-pull-request-reviewer[bot]') ;;
            *)
              echo "Review ${REVIEW_ID} is not attributable to Copilot (provider=${review_login:-unknown})." >&2
              exit 1
              ;;
          esac
          if [ "${review_commit}" != "${HEAD_SHA}" ]; then
            echo "Review ${REVIEW_ID} targets ${review_commit:-unknown}, not current head ${HEAD_SHA}." >&2
            exit 1
          fi

      - name: Check out the exact-head tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - name: Set up Python for the normalizer
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: platform/agent-control-plane/pyproject.toml

      - name: Fetch and normalize the exact-head review
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/comments" > /tmp/comments.json
          python - <<'PY'
          import json
          from pathlib import Path

          review = json.loads(Path('/tmp/copilot-event-review.json').read_text())
          comments = json.loads(Path('/tmp/comments.json').read_text())
          line_comments = [
              {'id': str(item['id']), 'source': 'line', 'actionable': True}
              for item in comments
              if item.get('pull_request_review_id') == review.get('id')
          ]
          body = (review.get('body') or '').lower()
          summary = []
          if body and 'no issues found' not in body and '[aep-clean]' not in body:
              summary.append({'id': f"summary:{review['id']}", 'source': 'summary', 'actionable': True})
          payload = {
              'reviewId': review.get('id'),
              'headSha': review.get('commit_id'),
              'submittedAt': review.get('submitted_at'),
              'state': review.get('state'),
              'lineComments': line_comments,
              'summaryFindings': summary,
          }
          Path('/tmp/copilot-review.json').write_text(json.dumps(payload))
          PY
          set +e
          python platform/agent-control-plane/scripts/copilot_review_gate.py \
            --head-sha "${HEAD_SHA}" /tmp/copilot-review.json > /tmp/copilot-result.json
          CODE=$?
          set -e
          if [ "${CODE}" -eq 2 ]; then
            echo "Copilot review could not be normalized safely." >&2
            exit 1
          fi

      - name: Publish the normalized result in the job summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          result = json.load(open('/tmp/copilot-result.json'))
          review = result['review']
          print('## AEP Copilot review gate')
          print()
          print(f"Conclusion: **{result['conclusion']}**")
          print(f"Review ID: `{review['reviewId']}`")
          print(f"Head SHA: `{review['headSha']}`")
          print(f"Actionable findings: {review['actionableFindings']}")
          print(f"Unrecognized findings: {review['unrecognizedFindings']}")
          print(f"Disputed findings: {len(review['disputedFindings'])}")
          PY

      - name: Enforce the normalized conclusion
        run: |
          CONCLUSION="$(python -c 'import json; print(json.load(open("/tmp/copilot-result.json"))["conclusion"])')"
          case "${CONCLUSION}" in
            success) exit 0 ;;
            neutral) exit 78 ;;
            pending|failure) exit 1 ;;
            *) echo "unknown conclusion: ${CONCLUSION}" >&2; exit 1 ;;
          esac
