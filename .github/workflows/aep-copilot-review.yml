name: AEP Copilot Review Gate

# Copilot is requested only after the guard workflow has completed successfully.
# The required check is the native `aep-copilot-review` Actions job on a
# completed Copilot review. Before that job exists for a new SHA, GitHub shows
# the required context as pending; no API-created check run is needed.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: ["Control Plane Guards"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request to request after its guard check passes"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: aep-copilot-review-${{ github.event.pull_request.number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  request-copilot:
    # workflow_run is privileged but never checks out or executes pull-request
    # code. It only reads provider data and requests a reviewer.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Request Copilot for the guarded head
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id || '' }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number || '' }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          if [ -n "${RUN_ID}" ]; then
            PR_NUMBER="$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}" --jq '.pull_requests[0].number // empty')"
            HEAD_SHA="$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}" --jq '.head_sha')"
          else
            PR_NUMBER="${EVENT_PR_NUMBER}"
            HEAD_SHA="${EVENT_HEAD_SHA}"
          fi
          if [ -z "${PR_NUMBER}" ]; then
            echo "Guard run is not attached to a pull request; no review requested."
            exit 0
          fi
          if [ -z "${HEAD_SHA}" ]; then
            HEAD_SHA="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          fi
          GUARD="$(gh api "repos/${REPOSITORY}/commits/${HEAD_SHA}/check-runs" --jq '.check_runs[] | select(.name == "control-plane-guards") | .conclusion' | head -n 1)"
          if [ "${GUARD}" != "success" ]; then
            echo "control-plane-guards is ${GUARD:-pending} for ${HEAD_SHA}; review request deferred."
            exit 0
          fi
          gh api --method POST "repos/${REPOSITORY}/pulls/${PR_NUMBER}/requested_reviewers" \
            -f 'reviewers[]=copilot-pull-request-reviewer[bot]'

  aep-copilot-review:
    # Human reviews do not start this job. A new push has no completed job for
    # its SHA, so the required context remains pending until Copilot submits.
    if: >-
      github.event_name == 'pull_request_review' &&
      (github.event.review.user.login == 'copilot-pull-request-reviewer' ||
      github.event.review.user.login == 'copilot-pull-request-reviewer[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the default-branch tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python for the normalizer
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: platform/agent-control-plane/pyproject.toml

      - name: Fetch and normalize the exact-head review
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews" > /tmp/reviews.json
          gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/comments" > /tmp/comments.json
          python - <<'PY'
          import json
          from pathlib import Path

          reviews = json.loads(Path('/tmp/reviews.json').read_text())
          comments = json.loads(Path('/tmp/comments.json').read_text())
          copilot = [item for item in reviews if item.get('user', {}).get('login') in {'copilot-pull-request-reviewer', 'copilot-pull-request-reviewer[bot]'}]
          if not copilot:
              raise SystemExit('no Copilot review event exists for this pull request')
          latest = copilot[-1]
          line_comments = [
              {'id': str(item['id']), 'source': 'line', 'actionable': True}
              for item in comments
              if item.get('pull_request_review_id') == latest.get('id')
          ]
          body = (latest.get('body') or '').lower()
          summary = []
          if body and 'no issues found' not in body and '[aep-clean]' not in body:
              summary.append({'id': f"summary:{latest['id']}", 'source': 'summary', 'actionable': True})
          payload = {
              'reviewId': latest.get('id'),
              'headSha': latest.get('commit_id'),
              'submittedAt': latest.get('submitted_at'),
              'state': latest.get('state'),
              'lineComments': line_comments,
              'summaryFindings': summary,
          }
          Path('/tmp/copilot-review.json').write_text(json.dumps(payload))
          PY
          set +e
          python platform/agent-control-plane/scripts/copilot_review_gate.py \
            --head-sha "${HEAD_SHA}" /tmp/copilot-review.json > /tmp/copilot-result.json
          CODE=$?
          set -e
          if [ "${CODE}" -eq 2 ]; then
            echo "Copilot review could not be normalized safely." >&2
            exit 1
          fi

      - name: Publish the normalized result in the job summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          result = json.load(open('/tmp/copilot-result.json'))
          review = result['review']
          print('## AEP Copilot review gate')
          print()
          print(f"Conclusion: **{result['conclusion']}**")
          print(f"Review ID: `{review['reviewId']}`")
          print(f"Head SHA: `{review['headSha']}`")
          print(f"Actionable findings: {review['actionableFindings']}")
          print(f"Unrecognized findings: {review['unrecognizedFindings']}")
          print(f"Disputed findings: {len(review['disputedFindings'])}")
          PY

      - name: Enforce the normalized conclusion
        run: |
          CONCLUSION="$(python -c 'import json; print(json.load(open("/tmp/copilot-result.json"))["conclusion"])')"
          case "${CONCLUSION}" in
            success) exit 0 ;;
            neutral) exit 78 ;;
            pending|failure) exit 1 ;;
            *) echo "unknown conclusion: ${CONCLUSION}" >&2; exit 1 ;;
          esac
